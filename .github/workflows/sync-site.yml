name: Sync and Build Personal Site

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    paths:
      - ".github/workflows/sync-site.yml"
      - ".rebuild-trigger"

permissions:
  contents: write

concurrency:
  group: personal-site-sync
  cancel-in-progress: true

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Clone VuePress source
        run: |
          git clone --depth=1 https://github.com/GodAlone945/vuepress-theme-hope.git "$RUNNER_TEMP/vuepress-source"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: /home/runner/work/_temp/vuepress-source
        run: pnpm install --frozen-lockfile

      - name: Build VuePress
        working-directory: /home/runner/work/_temp/vuepress-source
        run: pnpm docs:build

      - name: Verify build output
        run: test -f "$RUNNER_TEMP/vuepress-source/src/.vuepress/dist/index.html"

      - name: Sync build output
        run: |
          rsync -av --delete \
            --exclude=".git/" \
            --exclude=".github/" \
            --exclude=".rebuild-trigger" \
            "$RUNNER_TEMP/vuepress-source/src/.vuepress/dist/" \
            ./
          touch .nojekyll

      - name: Commit generated website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No website changes."
            exit 0
          fi
          git commit -m "deploy: sync latest VuePress site"
          git push origin main
